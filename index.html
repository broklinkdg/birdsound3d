<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BirdSound3D — Bird Calls on a 3D Globe</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="topbar">
    <h1>🐦 BirdSound3D</h1>
    <form id="search-form">
      <input type="text" id="species-input" placeholder="Species (e.g. Common Blackbird)" />
      <input type="text" id="country-input" placeholder="Country (optional)" />
      <button type="submit">Search</button>
      <span id="status"></span>
    </form>
  </header>

  <main>
    <div id="globeViz"></div>

    <aside id="panel">
      <h2>Recording details</h2>
      <div id="panel-content">
        <p class="hint">Click a point on the globe to play a bird recording.</p>
      </div>
      <canvas id="viz-canvas" width="280" height="90"></canvas>
      <audio id="audio-player" controls></audio>
      <div id="legend">
        <h3>Call type</h3>
        <ul id="legend-list"></ul>
      </div>
    </aside>
  </main>

  <script src="https://unpkg.com/globe.gl@2"></script>
  <script src="js/globe.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
